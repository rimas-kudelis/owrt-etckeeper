name: Test Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: ${{ matrix.arch }} build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch:
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: etckeeper
          V: s

      - name: Store packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-packages
          path: bin/packages/${{ matrix.arch }}/action/*.apk

      - name: Store logs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-logs
          path: |
            logs/
            PKG-INFO
